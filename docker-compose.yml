services:
  erasmus_ssc:
    image: ${DOCKER_REGISTRY-}erasmusssc
    build:
      context: .
      dockerfile: Erasmus_SSC/Erasmus_SSC/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
        - ASPNETCORE_URLS=http://+:8080
        - ConnectionStrings__DefaultConnection=${CONNECTIONSTRING}
        - Jwt__Key=${JWT_KEY}
        - FilePath=/app/files
    volumes:
        - erasmus-files:/app/files
    ports:
      - "${HTTP_PORT}:8080"
    restart: unless-stopped
   
  erasmus_postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=ERASMUS
      - POSTGRES_USER=ERASMUS
      - POSTGRES_PASSWORD=ERASMUS
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres-data:
  erasmus-files: