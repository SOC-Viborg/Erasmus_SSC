services:
  erasmus_ssc:
    image: ${DOCKER_REGISTRY-}erasmusssc
    build:
      context: .
      dockerfile: Erasmus_SSC/Erasmus_SSC/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
        - ASPNETCORE_URLS=http://+:${HTTP_PORT}
        - ConnectionStrings__DefaultConnection=${CONNECTIONSTRING}
        - Jwt__Key=${JWT_KEY}
    ports:
      - "${HTTP_PORT}:8080"
    restart: unless-stopped
   